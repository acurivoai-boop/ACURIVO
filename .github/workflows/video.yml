name: ACURIVO Daily AI Video
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  daily-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install AI tools
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts requests pillow yt-dlp ddgs
      - name: Create AI Video
        run: |
          python3 video_factory.py
      - name: Check video
        run: |
          ls -lh output/ACURIVO_VIDEO.mp4
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/ACURIVO_VIDEO.mp4
      # ==========================================================
      # PREPARE VIDEO
      # ==========================================================
      - name: Prepare video
        run: |
          mkdir -p transfer
          cp output/ACURIVO_VIDEO.mp4 \
             transfer/ACURIVO_VIDEO.mp4
          ls -lh transfer/ACURIVO_VIDEO.mp4
      # ==========================================================
      # SAVE ARTIFACT
      # ==========================================================
      - name: Save video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACURIVO-DAILY-VIDEO
          path: transfer/ACURIVO_VIDEO.mp4
          retention-days: 1
      # ==========================================================
      # CREATE GITHUB RELEASE
      # ==========================================================
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="acurivo-video-${{ github.run_number }}"
          echo "Creating release: $TAG"
          gh release create "$TAG" \
            transfer/ACURIVO_VIDEO.mp4 \
            --title "ACURIVO VIDEO ${{ github.run_number }}" \
            --notes "Automatic ACURIVO video transfer."
          echo "RELEASE CREATED"
      # ==========================================================
      # GET RELEASE ASSET URL
      # ==========================================================
      - name: Get release asset URL
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="acurivo-video-${{ github.run_number }}"
          URL=$(gh release view "$TAG" \
            --json assets \
            --jq '.assets[0].url')
          echo "ASSET_URL=$URL"
          echo "asset_url=$URL" >> "$GITHUB_OUTPUT"
      # ==========================================================
      # SEND VIDEO URL TO ACURIVO HUB
      # ==========================================================
      - name: Send video URL to ACURIVO HUB
        env:
          ACURIVO_WEBAPP: "https://script.google.com/macros/s/AKfycbzM2XkoawYfFdz97y5mc3UYjj3Sn8Bha8sn8SLpV0TcSEU1_PKS5M3bokLJMCyfmU5j/exec"
          VIDEO_URL: ${{ steps.release.outputs.asset_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          endpoint = os.environ["ACURIVO_WEBAPP"]
          video_url = os.environ["VIDEO_URL"]
          payload = {
              "action": "download_and_upload",
              "filename": "ACURIVO_VIDEO.mp4",
              "url": video_url
          }
          body = json.dumps(payload).encode("utf-8")
          print("SENDING VIDEO URL TO ACURIVO HUB...")
          print("VIDEO URL:")
          print(video_url)
          request = urllib.request.Request(
              endpoint,
              data=body,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          print("WAITING FOR ACURIVO HUB...")
          with urllib.request.urlopen(
              request,
              timeout=300
          ) as response:
              result = response.read().decode("utf-8")
              print("ACURIVO HUB RESPONSE:")
              print(result)
              if '"success":true' not in result.replace(" ", ""):
                  raise RuntimeError(
                      "ACURIVO HUB did not confirm successful upload."
                  )
          print("YOUTUBE UPLOAD CONFIRMED.")
          PY
      # ==========================================================
      # CLEAN OLD RELEASES
      # ==========================================================
      - name: Cleanup old ACURIVO releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cleaning old ACURIVO releases..."
          gh release list \
            --limit 20 \
            --json tagName \
            --jq '.[].tagName' |
          grep '^acurivo-video-' |
          head -n -3 |
          while read TAG
          do
            echo "Deleting $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          done || true
          echo "CLEANUP COMPLETE"