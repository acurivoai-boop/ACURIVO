name: ACURIVO Daily AI Video

on:
  schedule:
    - cron: '0 10 * * *'
      timezone: "Asia/Riyadh"
  workflow_dispatch:

jobs:
  daily-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install AI tools
        run: |
          pip install edge-tts requests pillow

      - name: ACURIVO Topic Scout
        run: |
          python3 video_factory.py

      - name: Upload completed video
        uses: actions/upload-artifact@v4
        with:
          name: ACURIVO-DAILY-VIDEO
          path: output/ACURIVO_VIDEO.mp4
          retention-days: 7