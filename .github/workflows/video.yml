name: ACURIVO Daily AI Video

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  daily-video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install AI tools
        run: |
          pip install edge-tts requests pillow yt-dlp

      - name: Create AI Video
        run: |
          python3 video_factory.py

      - name: Check video
        run: |
          ls -lh output/ACURIVO_VIDEO.mp4
          ffprobe -v error -show_entries format=duration,size \
          -of default=noprint_wrappers=1 \
          output/ACURIVO_VIDEO.mp4

      - name: Send video to ACURIVO HUB
        env:
          ACURIVO_WEBAPP: "https://script.google.com/macros/s/AKfycbzM2XkoawYfFdz97y5mc3UYjj3Sn8Bha8sn8SLpV0TcSEU1_PKS5M3bokLJMCyfmU5j/exec"
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          video_path = "output/ACURIVO_VIDEO.mp4"
          endpoint = os.environ["ACURIVO_WEBAPP"]

          with open(video_path, "rb") as f:
              video_data = f.read()

          size_mb = len(video_data) / 1024 / 1024
          print(f"VIDEO SIZE: {size_mb:.2f} MB")

          if size_mb > 45:
              raise RuntimeError(
                  f"Video is too large: {size_mb:.2f} MB"
              )

          payload = {
              "filename": "ACURIVO_VIDEO.mp4",
              "base64": base64.b64encode(video_data).decode("ascii")
          }

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("SENDING VIDEO TO ACURIVO HUB...")

          with urllib.request.urlopen(
              request,
              timeout=300
          ) as response:

              result = response.read().decode("utf-8")

              print("ACURIVO HUB RESPONSE:")
              print(result)

              if '"success":true' not in result.replace(" ", ""):
                  raise RuntimeError(
                      "ACURIVO HUB did not confirm successful upload."
                  )

          print("YOUTUBE UPLOAD CONFIRMED.")

          PY

      - name: Save completed video
        uses: actions/upload-artifact@v4
        with:
          name: ACURIVO-DAILY-VIDEO
          path: output/ACURIVO_VIDEO.mp4
          retention-days: 7